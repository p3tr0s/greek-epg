name: debug-cosmote
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          F=$(date -d "today 00:00" +%s); T=$((F+86399))
          H=(-H "referer: https://www.cosmotetv.gr/" -H "Origin: https://www.cosmotetv.gr" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36")
          echo "== one"; curl -s "${H[@]}" "https://mwapi-prod.cosmotetvott.gr/api/v3.4/epg/listings/el?from=$F&to=$T&callSigns=ant1hd&endingIncludedInRange=false" | head -c 1500; echo
          echo "== two"; curl -s "${H[@]}" "https://mwapi-prod.cosmotetvott.gr/api/v3.4/epg/listings/el?from=$F&to=$T&callSigns=ant1hd,alphahd&endingIncludedInRange=false" | head -c 800; echo
          echo "== enc"; curl -s "${H[@]}" "https://mwapi-prod.cosmotetvott.gr/api/v3.4/epg/listings/el?from=$F&to=$T&callSigns=ant1hd%2Calphahd&endingIncludedInRange=false" | head -c 300; echo
          echo "== nova"; curl -s "https://www.novasports.gr/wp-admin/admin-ajax.php?action=nova_get_template&template=tv-program/broadcast&dt=$(date +%F)" | grep -o 'class="channel"[^<]*<[^>]*>[^<]*' | head -40
